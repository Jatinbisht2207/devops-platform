apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-prod
resources: [../../base, namespace.yaml]
images:
  - name: ghcr.io/OWNER/orders-api
    newName: ghcr.io/OWNER/orders-api
    newTag: bootstrap          # replaced by CI with @sha256 digest after approval
patches:
  - target: {kind: Rollout, name: orders-api}
    patch: |-
      - {op: add, path: /spec/strategy/canary/analysis/args/-, value: {name: namespace, value: shop-prod}}
  - target: {kind: Ingress, name: orders-api}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: orders.example.com}
