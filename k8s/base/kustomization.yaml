apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - services.yaml
  - rollout.yaml
  - ingress.yaml
  - hpa-pdb.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: orders-api-dashboard
    files: [monitoring/dashboards/orders-api.json]
    options:
      disableNameSuffixHash: true
      labels: {grafana_dashboard: "1"}
