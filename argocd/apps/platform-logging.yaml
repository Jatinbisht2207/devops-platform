apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "1"}
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.10.2
    helm:
      releaseName: loki
      valuesObject:
        loki:
          persistence: {enabled: true, size: 30Gi}
          config:
            table_manager: {retention_deletes_enabled: true, retention_period: 336h}
        promtail:
          enabled: true
          pipelineStages:
            - cri: {}
            - json: {expressions: {level: level, path: path, status: status}}
            - labels: {level: }
        grafana: {enabled: false}
  destination: {server: https://kubernetes.default.svc, namespace: logging}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
