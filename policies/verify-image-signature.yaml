apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: {name: verify-image-signature}
spec:
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 30
  rules:
    - name: cosign-keyless
      match:
        any: [{resources: {kinds: [Pod], namespaces: ["shop-staging", "shop-prod"]}}]
      verifyImages:
        - imageReferences: ["ghcr.io/OWNER/orders-api*"]
          mutateDigest: true
          verifyDigest: true
          required: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/OWNER/REPO/.github/workflows/ci.yml@refs/heads/main
                    rekor: {url: https://rekor.sigstore.dev}
