name: k8s-validate
on:
  pull_request:
    paths: ['k8s/**', 'argocd/**', 'policies/**']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: imranismail/setup-kustomize@v2
      - name: Install kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
      - name: Render + schema-validate every overlay
        run: |
          for env in local staging prod; do
            kustomize build k8s/overlays/$env | kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: Misconfiguration scan
        uses: aquasecurity/trivy-action@0.28.0
        with: {scan-type: config, scan-ref: k8s, severity: 'HIGH,CRITICAL', exit-code: '1'}
