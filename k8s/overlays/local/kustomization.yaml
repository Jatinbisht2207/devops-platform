apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop-local
resources: [../../base, namespace.yaml]
images:
  - name: ghcr.io/OWNER/orders-api
    newName: orders-api
    newTag: local
patches:
  - target: {kind: Rollout, name: orders-api}
    patch: |-
      - {op: replace, path: /spec/replicas, value: 2}
      - {op: add, path: /spec/strategy/canary/analysis/args/-, value: {name: namespace, value: shop-local}}
      - op: replace
        path: /spec/strategy/canary/steps
        value:
          - {setWeight: 25}
          - {pause: {duration: 45s}}
          - {setWeight: 50}
          - {pause: {duration: 45s}}
          - {setWeight: 100}
  - target: {kind: HorizontalPodAutoscaler, name: orders-api}
    patch: |-
      - {op: replace, path: /spec/minReplicas, value: 2}
  - target: {kind: PodDisruptionBudget, name: orders-api}
    patch: |-
      - {op: replace, path: /spec/minAvailable, value: 1}
  - target: {kind: Ingress, name: orders-api}
    patch: |-
      - {op: replace, path: /spec/rules/0/host, value: orders.localtest.me}
      - {op: remove, path: /spec/tls}
      - {op: remove, path: "/metadata/annotations/cert-manager.io~1cluster-issuer"}
